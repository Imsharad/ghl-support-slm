# Decoding and model tags for every evaluation run.
# Source of truth: docs/dag/CONTRACTS.md section 5. Do not diverge without updating that file.

decoding:
  temperature: 0          # greedy
  top_p: 1.0
  repeat_penalty: 1.0
  max_new_tokens: 256
  num_ctx: 2048
  seed: 42
  stop:
    - "<|im_end|>"

prompt:
  system_file: configs/prompts/prompt.txt
  template: qwen2.5-chatml   # native Qwen2.5 ChatML; system turn applied once

backends:
  ollama:
    base_url: http://localhost:11434
    openai_compat_path: /v1/chat/completions

models:
  base:
    tag: ghl-base
    modelfile: serve/Modelfile.base
    gguf: artifacts/base-q8.gguf
  tuned:
    tag: ghl-support
    modelfile: serve/Modelfile
    gguf: artifacts/tuned-q8.gguf

evaluation:
  headline: blind_human_pass_rate      # 54 sealed challenge queries, base-Q8 vs tuned-Q8 through Ollama
  challenge_file: eval/challenge.jsonl
  dev_file: eval/dev.jsonl
  results_dir: eval/results
  bootstrap:
    resamples: 10000
    ci: 0.95
    seed: 42
  verdict_rules:
    positive_requires:
      min_gain_points: 5
      ci95_excludes_zero: true
      critical_errors_not_higher: true
    otherwise: inconclusive_or_negative
  never_retune_on_challenge: true
