# QLoRA fine-tune of Qwen2.5-1.5B-Instruct on the grouped Bitext train split.
# Hyperparameters are fixed by docs/dag/CONTRACTS.md section 5. Do not diverge
# without updating that file. Target: Colab Pro (A100 or L4), one epoch.

run_name: ghl-support-qlora
seed: 42
device: cuda            # cuda | mps | cpu | auto. mps is the measured Mac fallback (docs/LOCAL_QLORA_PROBE.md).
output_dir: train/runs

data:
  dir: data/processed
  train_file: train.jsonl
  val_file: val.jsonl
  cap_train: null       # full grouped train split
  max_length: 512

model:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: float16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

optim:
  lr: 1.0e-4
  schedule: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0

train:
  micro_batch_size: 1
  grad_accum: 16
  epochs: 1
  max_steps: null                 # null means one epoch over the loaded rows
  log_every: 25                   # train and val loss to loss.csv
  save_every: 100                 # resumable checkpoint
  val_batches: 32
  checkpoint_fractions: [0.5, 1.0]  # mid-epoch and end-of-epoch adapters for the dev comparison

hub:
  repo_id: sharadja/ghl-support-qlora
  private: true
  push_checkpoints: true          # needs HF_TOKEN in the environment; skipped with a warning if unset

smoke:
  rows: 64
  steps: 20
  grad_accum: 1
  log_every: 5
  save_every: 10
  val_batches: 4
  resume_from: 10
  resume_tolerance: 0.05
  data_dir: tests/fixtures/train_smoke   # tiny fixture; point at data/processed for a real smoke
