[project]
name = "ghl-support-slm"
version = "0.1.0"
description = "Fine-tune and self-host a small language model for customer support (GoHighLevel assignment)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "datasets>=3.0",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "rouge-score>=0.1.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "pytest>=8.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# CUDA-only. bitsandbytes has no arm64 macOS wheel; this extra installs on Colab, not on this Mac.
train = [
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44",
    "accelerate>=0.34",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "zstandard==0.25.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Keep the lock resolvable for the Colab CUDA box as well as this arm64 Mac.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
